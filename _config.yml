<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#070b16"/>
  <title>Helix Lab — Khám phá DNA và RNA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#1a4e7638,transparent 38%),radial-gradient(ellipse at 90% 25%,#5a2b862e,transparent 34%),#070b16;color:#e5eefb;font-family:Inter,system-ui,sans-serif}.glass{background:#0f172ab8;border:1px solid #94a3b824;backdrop-filter:blur(18px)}.gridbg{background-image:linear-gradient(#94a3b30b 1px,transparent 1px),linear-gradient(90deg,#94a3b30b 1px,transparent 1px);background-size:34px 34px}.canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.canvas:active{cursor:grabbing}.anchor{scroll-margin-top:85px}.answer:hover{border-color:#54e8ff88;background:#54e8ff12}::selection{background:#54e8ff55}
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const{useEffect,useRef,useState}=React;
const bases={A:{name:'Adenine',color:'#ff718b',type:'Purine',pair:'DNA: T · RNA: U',structure:'Base nitơ purine có hai vòng, liên kết với đường pentose và nhóm phosphate để tạo nucleotide.',role:'A bắt cặp với T trong DNA bằng 2 liên kết hydro; trong RNA, A bắt cặp với U.',fact:'Adenine cũng là thành phần của ATP, phân tử vận chuyển năng lượng quan trọng trong tế bào.'},T:{name:'Thymine',color:'#ffc857',type:'Pyrimidine',pair:'DNA: A · RNA: —',structure:'Base nitơ pyrimidine có một vòng, thường có trong DNA thay vì RNA.',role:'T bắt cặp với A bằng 2 liên kết hydro, góp phần giữ ổn định cấu trúc DNA.',fact:'Trong RNA, uracil (U) thay vị trí của thymine.'},G:{name:'Guanine',color:'#70e1a1',type:'Purine',pair:'DNA/RNA: C',structure:'Base nitơ purine có hai vòng, là thành phần của nucleotide DNA và RNA.',role:'G bắt cặp với C bằng 3 liên kết hydro.',fact:'Cặp G–C có ba liên kết hydro, nhiều hơn cặp A–T trong DNA.'},C:{name:'Cytosine',color:'#60a5fa',type:'Pyrimidine',pair:'DNA/RNA: G',structure:'Base nitơ pyrimidine có một vòng, có trong cả DNA và RNA.',role:'C bắt cặp với G bằng 3 liên kết hydro theo nguyên tắc bổ sung.',fact:'Trình tự các base là một phần quan trọng của thông tin di truyền.'},U:{name:'Uracil',color:'#c084fc',type:'Pyrimidine',pair:'RNA: A · DNA: —',structure:'Base nitơ pyrimidine một vòng, có trong RNA thay cho thymine.',role:'U có thể bắt cặp với A trong RNA.',fact:'mRNA dùng U trong các codon để truyền thông tin đến ribosome.'}};
const dseq='ATGCCGTAACTGACGTTAGC',rseq='AUGCCGUUACGACGUAAGC';
function Title({tag,title,desc}){return <div className="mb-8 max-w-2xl"><div className="mb-3 text-xs font-bold uppercase tracking-[.24em] text-cyan-300">{tag}</div><h2 className="text-3xl font-extrabold text-white sm:text-4xl">{title}</h2><p className="mt-3 leading-7 text-slate-400">{desc}</p></div>}
function Model({mode,onSelect}){const ref=useRef(null),cb=useRef(onSelect);useEffect(()=>{cb.current=onSelect},[onSelect]);useEffect(()=>{const el=ref.current,T=THREE;if(!el||!T)return;const scene=new T.Scene();scene.background=new T.Color('#0a1020');scene.fog=new T.Fog('#0a1020',12,26);const camera=new T.PerspectiveCamera(42,1,.1,100);camera.position.z=10.5;const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;el.appendChild(renderer.domElement);renderer.domElement.className='canvas';scene.add(new T.AmbientLight(0xb9d7ff,1.3));const l=new T.PointLight(0x54e8ff,75,30);l.position.set(4,4,6);scene.add(l);const l2=new T.PointLight(0xa78bfa,50,25);l2.position.set(-5,-2,-3);scene.add(l2);const group=new T.Group();scene.add(group);const pick=[],seq=mode==='DNA'?dseq:rseq,n=seq.length,step=.37,cy=(n-1)*step/2,prior=[null,null];function ball(r,c){return new T.Mesh(new T.SphereGeometry(r,16,16),new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.23,roughness:.36}))}function rod(a,b,color,r=.04){let v1=new T.Vector3(...a),v2=new T.Vector3(...b),dir=new T.Vector3().subVectors(v2,v1),m=new T.Mesh(new T.CylinderGeometry(r,r,dir.length(),8),new T.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.15}));m.position.copy(v1).add(v2).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir.normalize());group.add(m)}for(let i=0;i<n;i++){let angle=i*.72,y=i*step-cy,b=seq[i],rad=1.28,a=[Math.cos(angle)*rad,y,Math.sin(angle)*rad],ab=[Math.cos(angle)*.48,y,Math.sin(angle)*.48];let bead=ball(.18,mode==='DNA'?'#42d9ee':'#42d9ee');bead.position.set(...a);group.add(bead);let bm=ball(.14,bases[b].color);bm.position.set(...ab);bm.userData.base=b;group.add(bm);pick.push(bm);rod(a,ab,bases[b].color,.035);if(prior[0])rod(prior[0],a,'#42d9ee',.05);prior[0]=a;if(mode==='DNA'){let bb=({A:'T',T:'A',G:'C',C:'G'})[b],z=[Math.cos(angle+Math.PI)*rad,y,Math.sin(angle+Math.PI)*rad],zb=[Math.cos(angle+Math.PI)*.48,y,Math.sin(angle+Math.PI)*.48],bead2=ball(.18,'#a78bfa'),bm2=ball(.14,bases[bb].color);bead2.position.set(...z);bm2.position.set(...zb);bm2.userData.base=bb;group.add(bead2,bm2);pick.push(bm2);rod(z,zb,bases[bb].color,.035);rod(ab,zb,'#7183a6',.024);if(prior[1])rod(prior[1],z,'#a78bfa',.05);prior[1]=z}}
const ray=new T.Raycaster(),ptr=new T.Vector2();let down=null,moved=false;function resize(){let w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}const obs=new ResizeObserver(resize);obs.observe(el);resize();function pd(e){down={x:e.clientX,y:e.clientY};moved=false;renderer.domElement.setPointerCapture?.(e.pointerId)}function pm(e){if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(moved){group.rotation.y+=dx*.008;group.rotation.x=Math.max(-1.35,Math.min(1.35,group.rotation.x+dy*.008));down={x:e.clientX,y:e.clientY}}}function pu(e){if(down&&!moved){let r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);let hits=ray.intersectObjects(pick);cb.current(hits.length?{type:'base',base:hits[0].object.userData.base}:{type:'molecule',mode})}down=null}function wheel(e){e.preventDefault();camera.position.z=Math.max(5.5,Math.min(16,camera.position.z+e.deltaY*.008))}let cv=renderer.domElement;cv.addEventListener('pointerdown',pd);cv.addEventListener('pointermove',pm);cv.addEventListener('pointerup',pu);cv.addEventListener('wheel',wheel,{passive:false});let frame;function animate(){frame=requestAnimationFrame(animate);renderer.render(scene,camera)}animate();return()=>{cancelAnimationFrame(frame);obs.disconnect();cv.removeEventListener('pointerdown',pd);cv.removeEventListener('pointermove',pm);cv.removeEventListener('pointerup',pu);cv.removeEventListener('wheel',wheel);scene.traverse(o=>{o.geometry?.dispose();if(o.material)o.material.dispose()});renderer.dispose();el.removeChild(cv)}},[mode]);return <div ref={ref} className="h-full min-h-[350px] w-full overflow-hidden rounded-2xl"/>}
function App(){const[mode,setMode]=useState('DNA'),[selected,setSelected]=useState({type:'molecule',mode:'DNA'}),[seq,setSeq]=useState('ATGCCGTAA'),[result,setResult]=useState(null),[qi,setQi]=useState(0),[answer,setAnswer]=useState(null),[score,setScore]=useState(0);const detail=selected.type==='base'?bases[selected.base]:null;const questions=[{q:'Base nào bắt cặp với adenine trong DNA?',a:['Guanine (G)','Thymine (T)','Cytosine (C)','Uracil (U)'],c:1,e:'Trong DNA, A bắt cặp với T; trong RNA, A thường bắt cặp với U.'},{q:'Đường nào có trong RNA?',a:['Deoxyribose','Glucose','Ribose','Fructose'],c:2,e:'RNA chứa ribose; DNA chứa deoxyribose.'},{q:'Quá trình tạo RNA dựa trên khuôn DNA gọi là gì?',a:['Dịch mã','Phiên mã','Nhân đôi','Đột biến'],c:1,e:'Phiên mã sử dụng mạch DNA làm khuôn để tổng hợp RNA.'},{q:'Ribosome đọc mRNA theo nhóm bao nhiêu nucleotide?',a:['1','2','3','4'],c:2,e:'Một codon gồm ba nucleotide; codon có thể mã hóa amino acid hoặc tín hiệu kết thúc.'}];function run(){let dna=seq.toUpperCase().replace(/[^ATGC]/g,'');if(!dna){setResult({error:'Hãy nhập trình tự chỉ gồm A, T, G, C.'});return}let rna=dna.replaceAll('T','U'),table={AUG:'Met',UUU:'Phe',UUC:'Phe',UUA:'Leu',UUG:'Leu',UCU:'Ser',UCC:'Ser',UCA:'Ser',UCG:'Ser',UAU:'Tyr',UAC:'Tyr',UAA:'STOP',UAG:'STOP',UGU:'Cys',UGC:'Cys',UGA:'STOP',UGG:'Trp',CUU:'Leu',CUC:'Leu',CUA:'Leu',CUG:'Leu',CCU:'Pro',CCC:'Pro',CCA:'Pro',CCG:'Pro',CAU:'His',CAC:'His',CAA:'Gln',CAG:'Gln',CGU:'Arg',CGC:'Arg',CGA:'Arg',CGG:'Arg',AUU:'Ile',AUC:'Ile',AUA:'Ile',AAG:'Lys',ACU:'Thr',ACC:'Thr',ACA:'Thr',ACG:'Thr',AAU:'Asn',AAC:'Asn',AAA:'Lys',AGU:'Ser',AGC:'Ser',AGA:'Arg',AGG:'Arg',GUU:'Val',GUC:'Val',GUA:'Val',GUG:'Val',GCU:'Ala',GCC:'Ala',GCA:'Ala',GCG:'Ala',GAU:'Asp',GAC:'Asp',GAA:'Glu',GAG:'Glu',GGU:'Gly',GGC:'Gly',GGA:'Gly',GGG:'Gly'},codons=rna.match(/.{1,3}/g)||[];setResult({dna,rna,codons,amino:codons.filter(c=>c.length===3).map(c=>`${c} → ${table[c]||'?'}`)})}function selectMode(m){setMode(m);setSelected({type:'molecule',mode:m})}
return <><header className="fixed top-0 z-50 w-full border-b border-white/10 bg-[#070b16]/90 backdrop-blur-xl"><nav className="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6"><a href="#home" className="font-extrabold text-white">⌁ HELIX <span className="text-cyan-300">LAB</span></a><div className="hidden gap-6 text-sm text-slate-300 lg:flex">{[['Trang chủ','#home'],['Khám phá','#explore'],['So sánh','#compare'],['Mô phỏng','#simulation'],['Quiz','#quiz']].map(([x,y])=><a className="hover:text-cyan-300" href={y}>{x}</a>)}</div><a href="#explore" className="rounded-full border border-cyan-300/30 px-4 py-2 text-xs text-cyan-200">Vào phòng lab ↗</a></nav></header>
<main><section id="home" className="anchor gridbg relative px-4 pb-20 pt-36 text-center sm:px-6 sm:pt-44"><div className="mx-auto max-w-4xl"><span className="rounded-full border border-cyan-300/20 bg-cyan-300/5 px-4 py-2 text-xs font-semibold tracking-widest text-cyan-200">PHÒNG THÍ NGHIỆM DI TRUYỀN HỌC TƯƠNG TÁC</span><h1 className="mt-7 text-5xl font-extrabold leading-tight text-white sm:text-7xl">Khám phá <span className="bg-gradient-to-r from-cyan-300 to-violet-400 bg-clip-text text-transparent">DNA</span><br/>và RNA</h1><p className="mx-auto mt-6 max-w-2xl leading-7 text-slate-400">Bước vào thế giới phân tử của sự sống. Xoay mô hình 3D, tìm hiểu nucleotide và khám phá cách thông tin di truyền trở thành protein.</p><div className="mt-8 flex justify-center gap-3"><a className="rounded-xl bg-cyan-300 px-6 py-3 font-bold text-slate-950" href="#explore">Bắt đầu khám phá →</a><a className="rounded-xl border border-white/15 px-6 py-3" href="#simulation">Thử mô phỏng</a></div><div className="mx-auto mt-14 grid max-w-3xl grid-cols-3 gap-3">{['Cấu trúc phân tử','Phiên mã & dịch mã','Tương tác trực tiếp'].map((x,i)=><div className="glass rounded-2xl p-4"><div className="text-xs text-cyan-300">0{i+1}</div><div className="mt-2 text-xs font-semibold sm:text-sm">{x}</div></div>)}</div></div></section>
<section id="explore" className="anchor mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-24"><Title tag="Mô hình phân tử 3D" title="Chạm vào cấu trúc sự sống" desc="Chọn DNA hoặc RNA, kéo để xoay, cuộn để zoom và nhấp vào nucleotide trong mô hình để xem thông tin."/><div className="grid gap-5 lg:grid-cols-[1.55fr_1fr]"><div className="glass overflow-hidden rounded-3xl"><div className="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 px-5 py-4"><div className="flex gap-2">{['DNA','RNA'].map(m=><button onClick={()=>selectMode(m)} className={`rounded-lg px-4 py-2 text-sm font-bold ${mode===m?'bg-cyan-300 text-slate-950':'bg-white/5 text-slate-300'}`}>{m}</button>)}</div><span className="text-xs text-slate-500">Kéo xoay · Cuộn zoom · Nhấp nucleotide</span></div><div className="h-[400px] sm:h-[500px]"><Model mode={mode} onSelect={setSelected}/></div><div className="flex gap-3 border-t border-white/10 px-5 py-4"><span className="self-center text-xs text-slate-500">Chọn base:</span>{(mode==='DNA'?['A','T','G','C']:['A','U','G','C']).map(b=><button onClick={()=>setSelected({type:'base',base:b})} className="rounded-lg px-3 py-1.5 font-extrabold" style={{color:bases[b].color,background:bases[b].color+'18',border:`1px solid ${bases[b].color}55`}}>{b}</button>)}</div></div><aside className="glass rounded-3xl p-6"><div className="text-xs font-bold uppercase tracking-[.2em] text-violet-300">Bảng thông tin</div><h3 className="mt-3 text-2xl font-extrabold text-white">{detail?`${selected.base} · ${detail.name}`:`${selected.mode==='RNA'?'RNA — mạch đơn':'DNA — xoắn kép'}`}</h3>{detail?<div className="mt-5 space-y-5"><span className="rounded-full border border-white/10 px-3 py-1 text-xs text-slate-300">{detail.type} · {detail.pair}</span><Info title="Cấu trúc" text={detail.structure}/><Info title="Vai trò sinh học" text={detail.role}/><Info title="Bạn có biết?" text={detail.fact}/></div>:<div className="mt-5 space-y-5"><p className="leading-7 text-slate-400">{mode==='DNA'?'DNA thường gồm hai mạch polynucleotide bổ sung, ngược chiều nhau và xoắn quanh cùng trục. Khung đường–phosphate ở ngoài; các base hướng vào trong.':'RNA thường là một mạch polynucleotide, có thể tự gấp cuộn và tạo vùng bắt cặp bổ sung.'}</p><Info title="Thành phần nucleotide" text={mode==='DNA'?'Deoxyribose, phosphate và một base A, T, G hoặc C.':'Ribose, phosphate và một base A, U, G hoặc C.'}/><Info title="Vai trò" text={mode==='DNA'?'Lưu trữ và truyền đạt thông tin di truyền.':'Tham gia biểu hiện thông tin di truyền: mRNA mang tin, tRNA vận chuyển amino acid, rRNA tham gia cấu tạo và chức năng ribosome.'}/><p className="rounded-2xl border border-violet-300/15 bg-violet-300/5 p-4 text-sm leading-6 text-slate-300">{mode==='DNA'?'Nguyên tắc bổ sung: A–T và G–C.':'RNA dùng U thay cho T; các vùng bổ sung có thể bắt cặp A–U và G–C.'}</p></div>}</aside></div></section>
<section id="compare" className="anchor border-y border-white/5 bg-white/[.02] px-4 py-16 sm:px-6 sm:py-24"><div className="mx-auto max-w-7xl"><Title tag="Đặt cạnh nhau" title="DNA và RNA có gì khác?" desc="Cả hai là acid nucleic tạo từ nucleotide, nhưng có cấu trúc và nhiệm vụ đặc trưng."/><div className="glass overflow-hidden rounded-3xl">{[['Đặc điểm','DNA','RNA'],['Đường','Deoxyribose','Ribose'],['Base đặc trưng','Thymine (T)','Uracil (U)'],['Cấu trúc thường gặp','Hai mạch xoắn kép','Một mạch, có thể gấp cuộn'],['Vai trò chính','Lưu trữ thông tin di truyền','Tham gia biểu hiện thông tin di truyền'],['Một số dạng','DNA nhân, DNA ti thể...','mRNA, tRNA, rRNA và nhiều RNA khác']].map((row,i)=><div className={`grid grid-cols-3 border-b border-white/[.06] last:border-0 ${i===0?'bg-white/[.03]':''}`}>{row.map((v,j)=><div className={`p-4 text-xs leading-5 sm:p-5 sm:text-sm ${i===0?'font-bold text-cyan-300':j===0?'font-semibold text-slate-300':'text-slate-400'}`}>{v}</div>)}</div>)}</div><p className="mt-4 text-xs text-slate-500">Đây là các đặc điểm khái quát; cấu trúc và vai trò cụ thể có thể khác giữa các sinh vật và loại phân tử.</p></div></section>
<section id="simulation" className="anchor mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-24"><Title tag="Trung tâm mô phỏng" title="Từ trình tự đến protein" desc="Nhập mạch mã hóa DNA 5′→3′. Mô phỏng thay T b��ng U để tạo mRNA, rồi chia trình tự thành codon để minh họa dịch mã."/><div className="grid gap-5 lg:grid-cols-2"><div className="glass rounded-3xl p-6"><label className="text-sm font-bold text-white" htmlFor="seq">Trình tự DNA mạch mã hóa</label><p className="mt-1 text-xs text-slate-500">Chỉ dùng A, T, G, C. Ví dụ: ATGCCGTAA</p><div className="mt-4 flex flex-col gap-3 sm:flex-row"><input id="seq" value={seq} onChange={e=>setSeq(e.target.value)} className="min-w-0 flex-1 rounded-xl border border-white/10 bg-[#080e1b] px-4 py-3 font-mono text-cyan-200 outline-none focus:border-cyan-300/50"/><button onClick={run} className="rounded-xl bg-violet-400 px-5 py-3 font-bold text-slate-950">Chạy mô phỏng</button></div><div className="mt-6 grid grid-cols-3 gap-2 text-center">{['DNA 🧬','mRNA 〰️','Codon ▦'].map(x=><div className="rounded-xl border border-white/10 bg-white/[.03] p-3 text-sm text-cyan-200">{x}</div>)}</div></div><div className="glass min-h-[260px] rounded-3xl p-6"><div className="text-xs font-bold uppercase tracking-[.2em] text-cyan-300">Kết quả mô phỏng</div>{!result?<p className="mt-8 text-sm leading-7 text-slate-500">Nhập trình tự rồi chạy để xem mRNA, codon và amino acid minh họa.</p>:result.error?<p className="mt-6 rounded-xl border border-rose-400/20 p-4 text-rose-200">{result.error}</p>:<div className="mt-5 space-y-4"><Seq label="DNA mạch mã hóa (5′→3′)" value={result.dna}/><Seq label="mRNA (5′→3′)" value={result.rna}/><div><div className="mb-2 text-xs text-slate-400">Codon và amino acid</div><div className="flex flex-wrap gap-2">{result.codons.map(c=><span className="rounded-lg border border-violet-300/20 bg-violet-300/5 px-2.5 py-1.5 font-mono text-xs text-violet-200">{c}</span>)}</div><p className="mt-3 text-xs text-slate-400">{result.amino.join(' · ')}</p></div><p className="text-xs leading-5 text-slate-500">Minh họa dùng mạch mã hóa; dịch mã thực tế thường khởi đầu tại codon mở đầu và phụ thuộc khung đọc. ? là codon chưa có trong bảng rút gọn.</p></div>}</div></div><div className="mt-5 grid gap-3 sm:grid-cols-3">{[['01','Phiên mã','RNA polymerase tổng hợp RNA dựa trên mạch khuôn DNA.'],['02','Xử lý & vận chuyển','Ở sinh vật nhân thực, mRNA thường được xử lý trước khi ra tế bào chất.'],['03','Dịch mã','Ribosome đọc codon mRNA và kết hợp amino acid thành polypeptide.']].map(([n,t,d])=><div className="glass rounded-2xl p-4"><div className="text-xs text-violet-300">{n}</div><h3 className="mt-2 font-bold text-white">{t}</h3><p className="mt-1 text-xs leading-5 text-slate-400">{d}</p></div>)}</div></section>
<section id="quiz" className="anchor border-y border-white/5 bg-white/[.02] px-4 py-16 sm:px-6 sm:py-24"><div className="mx-auto max-w-4xl"><Title tag="Kiểm tra kiến thức" title="Bạn đã nắm được bao nhiêu?" desc="Trả lời từng câu để củng cố kiến thức về DNA, RNA và biểu hiện gene."/><div className="glass rounded-3xl p-6 sm:p-8"><div className="flex justify-between"><span className="rounded-full bg-cyan-300/10 px-3 py-1.5 text-xs font-bold text-cyan-200">CÂU {qi+1} / {questions.length}</span><span className="text-sm text-slate-400">Điểm: <b className="text-white">{score}</b></span></div><h3 className="mt-6 text-xl font-bold text-white">{questions[qi].q}</h3><div className="mt-5 grid gap-3 sm:grid-cols-2">{questions[qi].a.map((x,i)=>{let cl='border-white/10 bg-white/[.025] text-slate-300';if(answer!==null&&i===questions[qi].c)cl='border-emerald-400/50 bg-emerald-400/10 text-emerald-200';else if(answer===i)cl='border-rose-400/50 bg-rose-400/10 text-rose-200';return <button onClick={()=>{if(answer===null){setAnswer(i);if(i===questions[qi].c)setScore(score+1)}}} className={`answer rounded-xl border p-4 text-left text-sm font-semibold ${cl}`}>{String.fromCharCode(65+i)}　{x}</button>})}</div>{answer!==null&&<div className="mt-5 flex flex-col justify-between gap-4 rounded-xl border border-cyan-300/15 bg-cyan-300/5 p-4 sm:flex-row sm:items-center"><p className="text-sm leading-6 text-slate-300">{questions[qi].e}</p><button onClick={()=>{setQi((qi+1)%questions.length);setAnswer(null)}} className="rounded-lg bg-cyan-300 px-4 py-2 text-sm font-bold text-slate-950">Câu tiếp theo →</button></div>}</div></div></section></main><footer className="mx-auto flex max-w-7xl flex-col justify-between gap-3 px-4 py-8 text-xs text-slate-500 sm:flex-row sm:px-6"><span><b className="text-slate-300">HELIX LAB</b> · Cùng khám phá ngôn ngữ của sự sống.</span><a href="#home">Trở về đầu trang ↑</a></footer></>}
function Info({title,text}){return <div><h4 className="mb-1 text-sm font-bold text-slate-200">{title}</h4><p className="text-sm leading-6 text-slate-400">{text}</p></div>}function Seq({label,value}){return <div><div className="mb-1 text-xs font-semibold text-slate-400">{label}</div><div className="break-all rounded-lg border border-white/10 bg-[#080e1b] px-3 py-2 font-mono text-sm tracking-wider text-cyan-200">{value}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

